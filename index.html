            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "È una differenza sottile.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Ma enorme.",
            "page": 36
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Cammina lentamente.)",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Vedete…",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Dante non scrive il Paradiso per farci dormire.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Lo scrive per farci vergognare un poco.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Per dire:",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "“Guardate quanto siete piccoli…",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e quanto potreste essere grandi.”",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E allora Francesco diventa luce.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Sì.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Ma non perché fosse perfetto.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché era pericolosamente umano.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Aveva fame.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Paura.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Dubbi.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perfino il desiderio di sparire.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E Dante prende tutta quella fragilità…",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e la trasforma in una domanda.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Non in una risposta.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "“La lor concordia e i lor lieti sembianti,",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "amore e maraviglia e dolce sguardo,",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "facieno esser cagion di pensier santi.”",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Dante vide amore, meraviglia e dolcezza.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Noi, dopo ottocento anni, rischiamo di vedere solo il santino.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Per questo Francesco entra in questa commedia:",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "non per insegnarci a diventare santi…",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "ma per ricordarci che la libertà, quando passa davanti agli uomini,",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "viene quasi sempre scambiata per un miracolo.",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Per questo il Paradiso c’entra.",

      },
      {

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché questa storia non parla di un santo.",

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Parla del litigio eterno tra l’uomo e la sua immagine.",

      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Tra quello che siamo…",
            "page": 37
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e quello che mettiamo in vetrina.",

      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Tra il dolore vero…",
            "page": 38
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e la sua versione da esposizione.",
            "page": 38
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Sorride con ironia.)",
            "page": 38
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Diciamocelo.",
            "page": 38
      },

            "type": "line",
            "speaker": "NARRATRICE",

            "key": "narratrice",

      {

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Stanno fermi.",

      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Al massimo li sposti di processione.",

      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Un uomo vivo invece è una tragedia.",

            "speaker": "NARRATRICE",
            "key": "narratrice",

            "speaker": "NARRATRICE",
            "key": "narratrice",

            "speaker": "NARRATRICE",

      {

            "speaker": "NARRATRICE",
            "key": "narratrice",

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",

      {

            "speaker": "NARRATRICE",
            "key": "narratrice",

            "text": "Francesco faceva questo.",

            "speaker": "NARRATRICE",
            "key": "narratrice",

            "text": "Per questo è diventato santo.",

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E per questo, se tornasse oggi…",

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "probabilmente lo inviteremmo a un convegno su sé stesso.",

      {

            "speaker": "NARRATRICE",
            "key": "narratrice",

            "text": "Con buffet finale.",

      {

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E lui magari uscirebbe prima.",

      {

            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Per andare a parlare con qualcuno fuori.",

      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Sempre lì finisce.",

      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",

            "text": "Fuori.",

      {

            "note": "",

      {

            "key": "narratore",

      },
      {

      {

            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Perché la gloria, alla fine, serve a poco…",

      {

            "speaker": "NARRATORE",

            "note": "",
            "text": "se non scende a sporcarsi le scarpe.",

      },
      {

            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "E Dante questo lo sapeva.",

      },

            "speaker": "NARRATORE",
            "key": "narratore",

            "text": "Francesco pure.",

      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Noi…",

      },
      {

            "key": "narratore",
            "note": "",
            "text": "siamo ancora in prova.",

      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Guarda il pubblico. Un sorriso lieve.)",

      },
      {

      },
      {

            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Le luci si spengono.",

      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ma state attenti.",

      },
      {

            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Perché l’uomo che cercavamo…",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "potrebbe non essere uscito dal teatro.",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Potrebbe essersi seduto qui.",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "In platea.",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Silenzioso.",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "A guardarci.",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Con quell’aria strana di chi non vuole essere venerato…",
            "page": 39
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ma solo ascoltato.",
            "page": 39
      },
      {

            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Buio.)",
            "page": 39
      }
];
    const speakerMap = Object.fromEntries(speakers.map((speaker) => [speaker.key, speaker]));
    const storageKey = "prima-attesa-tv-index";
    const sizeKey = "prima-attesa-tv-size";

    let index = Math.min(Number(localStorage.getItem(storageKey) || 0), cues.length - 1);
    let cueSize = Number(localStorage.getItem(sizeKey) || 8.6);

    const body = document.body;
    const speakerName = document.getElementById("speakerName");
    const speakerNote = document.getElementById("speakerNote");
    const lineText = document.getElementById("lineText");
    const nextSpeaker = document.getElementById("nextSpeaker");
    const nextText = document.getElementById("nextText");
    const counter = document.getElementById("counter");
    const progressFill = document.getElementById("progressFill");
    const nextPanel = document.getElementById("nextPanel");
    const palette = document.getElementById("palette");

    function setSize(value) {
      cueSize = Math.min(12, Math.max(5.4, value));
      document.documentElement.style.setProperty("--cue-size", cueSize + "vh");
      localStorage.setItem(sizeKey, String(cueSize));
    }

    function cueColor(cue) {
      return speakerMap[cue?.key]?.color || "#f8fafc";
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      const full = value.length === 3
        ? value.split("").map((char) => char + char).join("")
        : value;
      return {
        r: parseInt(full.slice(0, 2), 16),
        g: parseInt(full.slice(2, 4), 16),
        b: parseInt(full.slice(4, 6), 16),
      };
    }

    function relativeLuminance(hex) {
      const { r, g, b } = hexToRgb(hex);
      const channels = [r, g, b].map((value) => {
        const normalized = value / 255;
        return normalized <= 0.03928
          ? normalized / 12.92
          : Math.pow((normalized + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
    }

    function contrastTheme(bgColor) {
      const luminance = relativeLuminance(bgColor);
      const blackContrast = (luminance + 0.05) / 0.05;
      const whiteContrast = 1.05 / (luminance + 0.05);
      const lightBackground = blackContrast >= whiteContrast;
      return {
        text: lightBackground ? "#07111f" : "#f8fafc",
        muted: lightBackground ? "rgba(7, 17, 31, 0.72)" : "rgba(255, 255, 255, 0.76)",
        panel: lightBackground ? "rgba(255, 255, 255, 0.34)" : "rgba(0, 0, 0, 0.25)",
        line: lightBackground ? "rgba(7, 17, 31, 0.26)" : "rgba(255, 255, 255, 0.3)",
        button: lightBackground ? "rgba(255, 255, 255, 0.36)" : "rgba(0, 0, 0, 0.28)",
        nextText: lightBackground ? "rgba(7, 17, 31, 0.82)" : "rgba(255, 255, 255, 0.88)",
      };
    }

    function renderPalette() {
      palette.innerHTML = speakers
        .filter((speaker) => !["stage", "section"].includes(speaker.key))
        .map((speaker) => '<div class="chip" style="--chip:' + speaker.color + '"><span class="swatch"></span><span>' + speaker.label + '</span></div>')
        .join("");
    }

    function go(delta) {
      index = Math.min(cues.length - 1, Math.max(0, index + delta));
      localStorage.setItem(storageKey, String(index));
      render();
    }

    function render() {
      const cue = cues[index];
      const next = cues[index + 1];
      const accent = cueColor(cue);
      const theme = contrastTheme(accent);
      const note = cue.note || "";

      body.className = cue.type || "";
      body.style.setProperty("--bg", accent);
      body.style.setProperty("--accent", theme.text);
      body.style.setProperty("--text", theme.text);
      body.style.setProperty("--muted", theme.muted);
      body.style.setProperty("--panel", theme.panel);
      body.style.setProperty("--line", theme.line);
      body.style.setProperty("--button-bg", theme.button);
      body.style.setProperty("--next-text", theme.nextText);
      speakerName.textContent = cue.speaker;
      speakerNote.textContent = note;
      speakerNote.classList.toggle("visible", Boolean(note));
      lineText.textContent = cue.text;
      // Fit long speeches in the available stage without covering the last line.
      lineText.style.fontSize = "";
      requestAnimationFrame(() => {
        let px = parseFloat(getComputedStyle(lineText).fontSize);
        while (lineText.scrollHeight > lineText.clientHeight && px > 30) {
          px -= 2;
          lineText.style.fontSize = px + "px";
        }
      });
      counter.textContent = String(index + 1).padStart(3, "0") + " / " + String(cues.length).padStart(3, "0");
      progressFill.style.width = ((index + 1) / cues.length * 100).toFixed(2) + "%";

      if (next) {
        const nextAccent = cueColor(next);
        const nextTheme = contrastTheme(nextAccent);
        nextPanel.style.setProperty("--next-bg", nextAccent);
        nextPanel.style.setProperty("--next-contrast", nextTheme.text);
        nextPanel.style.setProperty("--next-muted", nextTheme.muted);
        nextSpeaker.textContent = next.speaker;
        nextText.textContent = next.text;
      } else {
        nextPanel.style.setProperty("--next-bg", theme.panel);
        nextPanel.style.setProperty("--next-contrast", theme.text);
        nextPanel.style.setProperty("--next-muted", theme.muted);
        nextSpeaker.textContent = "FINE";
        nextText.textContent = "";
      }
    }

    document.getElementById("prevBtn").addEventListener("click", () => go(-1));
    document.getElementById("nextBtn").addEventListener("click", () => go(1));
    document.getElementById("smallerBtn").addEventListener("click", () => setSize(cueSize - 0.4));
    document.getElementById("largerBtn").addEventListener("click", () => setSize(cueSize + 0.4));
    document.getElementById("fullBtn").addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    document.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.key === "ArrowRight" || event.key === " " || event.key === "Enter") {
        event.preventDefault();
        go(1);
      }
      if (event.key === "ArrowLeft" || event.key === "Backspace") {
        event.preventDefault();
        go(-1);
      }
      if (event.key === "+" || event.key === "=") setSize(cueSize + 0.4);
      if (event.key === "-" || event.key === "_") setSize(cueSize - 0.4);
      if (event.key.toLowerCase() === "f") document.getElementById("fullBtn").click();
      if (event.key === "Home") {
        index = 0;
        localStorage.setItem(storageKey, String(index));
        render();
      }
      if (event.key === "End") {
        index = cues.length - 1;
        localStorage.setItem(storageKey, String(index));
        render();
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest("button")) go(1);
    });

    const audioTracks = [
      ["Prologo", "1 prologo.mp3"], ["Primo movimento", "2 musica primo movimento - Copia.mp3"],
      ["Paesane", "3 musica paesane.mp3"], ["Dopo paesane", "4 dopo paesane.mp3"],
      ["Monologo", "5 monologo di francesco.mp3"], ["Suore", "6 suore.mp3"],
      ["Secondo movimento", "7 musica secondo movimento.mp3"], ["Paradiso", "8 paradiso.mp3"],
      ["Ambient", "9 medieval ambient.mp3"], ["Finale", "10 musica finale.mp3"],
      ["Applausi", "applausi-teatro.mp3"], ["Chiacchiericcio", "chiacchiericcio-teatro.mp3"],
      ["Risata", "risata-teatro.mp3"], ["Campane", "campane-annuncio.mp3"],
      ["Mormorio", "mormorio-drammatico.mp3"], ["Transizione", "transizione-scena.mp3"],
      ["Coro 1", "cori/Il_nome_in_vetrina.mp3"], ["Coro 2", "cori/Tutti_lo_usano.mp3"], ["Coro 3", "cori/Invocazione_ad_Assisi.mp3"], ["Coro 4", "cori/Solenne_Elogio.mp3"], ["Coro 5", "cori/Il_peso_della_pietra.mp3"], ["Coro 6", "cori/Santa_disobbedienza.mp3"], ["Coro 7", "cori/Reso_Compatibile.mp3"], ["Coro 8", "cori/Francesco_sia_un_simbolo.mp3"], ["Coro 9", "cori/Il_Santo_Non_L_uomo.mp3"], ["Coro 10", "cori/Francesco_rassicuraci.mp3"], ["Coro 11", "cori/A_l’é_pa_capità.mp3"], ["Coro 12", "cori/Il_respiro_del_santo.mp3"]
    ];
    const board = document.getElementById("soundboard");
    const audio = new Audio();
    audio.loop = false;
    audioTracks.forEach(([label, file]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.title = `Riproduci ${label}`;
      b.addEventListener("click", () => {
        const folder = /^\d+ /.test(file) ? "audio/tracce/" : "audio/";
        audio.src = folder + encodeURIComponent(file);
        audio.play().catch(() => {});
      });
      board.appendChild(b);
    });
    const stop = document.createElement("button"); stop.type = "button"; stop.textContent = "■"; stop.title = "Ferma audio";
    stop.addEventListener("click", () => { audio.pause(); audio.currentTime = 0; }); board.appendChild(stop);
    const vol = document.createElement("input"); vol.type = "range"; vol.min = 0; vol.max = 1; vol.step = .05; vol.value = .8; vol.title = "Volume";
    vol.addEventListener("input", () => audio.volume = vol.value); board.appendChild(vol);

    document.getElementById("offlineBtn").addEventListener("click", () => {
      const source = '<!doctype html>\\n' + document.documentElement.outerHTML;
      const blob = new Blob([source], {type: 'text/html;charset=utf-8'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'francesco-teleprompter-offline.html';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });

    setSize(cueSize);
    renderPalette();
    render();
  </script>
</body>
