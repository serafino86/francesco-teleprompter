            "key": "fratefrancesco",
            "note": "",
            "text": "e gli sguardi chiedono spiegazioni,",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e le spiegazioni diventano dottrina.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io non volevo nasconderle",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "perché il dolore negato diventa menzogna.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Il vero scandalo non sono le stimmate.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "È solo che non servivano.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non salvavano nessuno.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non guariscono il mondo.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non rendono migliori i frati.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Erano inutili.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E proprio per questo erano vere.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Tommaso mi ha lasciato umano.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Bonaventura mi ha reso necessario.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma io volevo restare pericoloso.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Ma noi vogliamo che Francesco ci rassicuri!",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Un Francesco che nasconde troppo",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "diventa un asceta silenzioso.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Un Francesco che mostra troppo",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "diventa un’icona gestibile.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Il vero Francesco è quello che non funziona.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Quello che non si lascia usare.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Quello che non coincide",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "né con la vergogna",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "né con la gloria.",
            "page": 21
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(si volta verso il pubblico)",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Se mi cercate nelle stimmate,",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "mi perdete.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Se mi cercate nel pudore,",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "mi addolcite.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Cercatemi nel punto esatto",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "in cui la Chiesa ha avuto bisogno di cambiarmi.",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Lì. Proprio lì",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "io sono ancora vivo.",
            "page": 21
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(il Frate scompare nel buio)",
            "page": 21
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(musica)",
            "page": 21
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "(voci di mercato)",
            "page": 21
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "Grazie, sorelle, per aver accettato l’intervista. Vorrei parlare di San Francesco… con sincerità storica. Solo fatti, eh.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 1",
            "key": "suora1",
            "note": "",
            "text": "Oh, certo! San Francesco era di una povertà assoluta… talmente povero che a volte gli mancava pure la povertà.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "",
            "text": "E pensi che parlava con gli animali! Con tutti gli animali! Galline, lupi, piccioni, vespe… perfino con i pidocchi.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Interessante. Ho letto che un giorno ha fermato una guerra solo con lo sguardo.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 3",
            "key": "suora3",
            "note": "",
            "text": "Mah, “solo con lo sguardo” non rende. Diciamo che fece un discorso così santo che le spade si vergognarono e si piegarono da sole.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Incredibile. E confermate che camminasse sull’acqua almeno il giovedì?",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 1",
            "key": "suora1",
            "note": "",
            "text": "No, no, sull’acqua no…",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 1",
            "key": "suora1",
            "note": "",
            "text": "Sul fango. Che è più difficile. Non ti sporchi e sembri pure mistico.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "(ispirata)",
            "text": "Una volta benedisse un campo… e nacquero ciliegi, fichi, triglie e… una biblioteca.",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Una biblioteca?",
            "page": 22
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "",
            "text": "Eh, (sospira) che miracoli!",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "(scrive furiosamente)",
            "text": "Perfetto! Titolo: “Francesco, l’uomo che parlò agli animali, piegò le spade, attraversò il fango e fondò un frutteto bibliografico”.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Sarà un successone.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "SUORA 3",
            "key": "suora3",
            "note": "(sorriso angelico)",
            "text": "Mi raccomando, scriva anche che era umile.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Umilissimo. Il Santo più umile della storia…, naturalmente.",
            "page": 23
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Il giornalista è eccitatissimo. Le suore sono ispirate, un po’ troppo)",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Riprendiamo. Dunque, San Francesco… figura storica, spirituale, equilibrata… o forse no?",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "SUORA 1",
            "key": "suora1",
            "note": "(convinta)",
            "text": "Equilibratissima! A tal punto che, quando pregava riusciva a rimanere fermo ore… sospeso a mezz’aria.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Ah! Levitazione stabile, direi. Quindi parliamo di un primato europeo in campo aerospirituale.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "",
            "text": "Certamente. E poi, quando predicava, le nuvole si fermavano ad ascoltare.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Straordinario! Scriverò: “San Francesco, l’uomo che mise in pausa il meteo”.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "SUORA 3",
            "key": "suora3",
            "note": "",
            "text": "E guardi… lui non solo parlava con gli animali. Li educava. Il lupo di Gubbio? Dopo Francesco diceva “buongiorno”.",
            "page": 23
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Splendido! “Francesco, l’uomo che civilizzò il lupo”.",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "",
            "text": "E poi… non so se possiamo dirlo…",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "(spalanca gli occhi)",
            "text": "Dite! Il pubblico ha diritto alla verità più incredibile!",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "(sussurra sacra)",
            "text": "Pare abbia fatto rifiorire una roccia.",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "SUORA 3",
            "key": "suora3",
            "note": "",
            "text": "Non un fiore. Un giardino intero. Con tanto di fontana e panchine!",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "(trionfante)",
            "text": "Fantastico! Urbanistica miracolosa!",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "SUORA 1",
            "key": "suora1",
            "note": "",
            "text": "Ah, aggiunga che predicò ai pesci… e i pesci applaudivano con le pinne.",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Ovviamente! Applausi subacquei certificati. Perfetto per un inserto culturale.",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "(andando sul mistico-surreale)",
            "text": "E quando dormiva, sognava talmente bene che la realtà, per educazione, cercava di imitarlo.",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "(quasi in estasi professionale, rivolto al pubblico)",
            "text": "Titolo definitivo: “Francesco: santo, pacificatore, aviatore spirituale, meteorologo celeste, urbanista miracoloso e coach relazionale per animali e cristiani”.",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Vendite assicurate!",
            "page": 24
      },
      {
            "type": "line",
            "speaker": "SUORA 3",
            "key": "suora3",
            "note": "(pia, ma complice)",
            "text": "Ma si ricordi di dire che era soprattutto semplice.",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Semplicissimo. Un uomo che faceva cose impossibili… con naturalezza. Come se niente fosse.",
            "page": 25
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Pausa. Il giornalista li guarda come chi ha trovato l’oro)",
            "page": 25
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(verso il pubblico)",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Se continuano così, diventa più fantasy di Tolkien… ma con l’imprimatur.",
            "page": 25
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Le suore si ricompongono. Sorriso santo)",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "SUORA 1",
            "key": "suora1",
            "note": "",
            "text": "Forse abbiamo esagerato un filino…",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "SUORA 2",
            "key": "suora2",
            "note": "",
            "text": "Un filino miracoloso.",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "SUORA 3",
            "key": "suora3",
            "note": "",
            "text": "Ma in fondo… se non esageriamo noi, chi deve farlo? I peccatori?",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "Grazie, sorelle.",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "GIORNALISTA",
            "key": "giornalista",
            "note": "",
            "text": "E grazie a San Francesco… per la collaborazione narrativa.",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "(irrompe sulla scena si inginocchia e di spalle dice)",
            "text": "Oh, fratelli miei… e sorelle… e pure tu, giornalista con la penna più veloce della fantasia!",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Mi avete ascoltato male.",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Male, malissimo.",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io predicavo semplicità… e mi avete costruito un parco divertimenti di miracoli sopra!",
            "page": 25
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Si passa una mano sulla fronte, incredulo)",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io che volavo?",
            "page": 25
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io che fermavo le nuvole?",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io che trasformavo pietre in giardini condominiali?",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io che addestravo lupi al bon ton?",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma che sono diventato? Un supereroe medievale sponsorizzato dal buon Dio!?",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Parlavo con gli animali, sì… ma perché gli uomini non ascoltavano!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Amavo la povertà… non perché faceva scena nei giornali!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ero fragile, spaventato, ridicolo, a volte sbagliato… ed è lì che stava la Grazia!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Altro che effetti speciali!",
            "page": 26
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Si gira verso le suore)",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E voi! Care sorelle, anime devote…",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Avete messo zucchero sulla verità, panna sulla povertà, coriandoli sui dolori!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io ho camminato nel fango davvero… e mi sporcavo! Eccome se mi sporcavo!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Altro che levitazione “a mezz’aria”!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Al massimo inciampavo in qualche sasso!",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Si ferma. (Silenzio. Poi un sorriso amaro e tenero insieme)",
            "page": 26
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "Sapete cos’è il miracolo?",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non piegare le spade.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma convincere un uomo a non usarle.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non domare un lupo.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma riconoscere che a volte… il lupo siamo noi.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non far fiorire le pietre.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma far fiorire i cuori duri.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Questo sì… forse è successo.",
            "page": 26
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Alza gli occhi al cielo con una pazienza esasperata)",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Signore, perdonali…",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non sanno raccontare semplice.",
            "page": 26
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(si gire verso il pubblico)",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E voi… quando parlerete di me…",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "non fatemi perfetto.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Fatemi umano.",
            "page": 26
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "È molto più difficile. E molto più santo.",
            "page": 26
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Francesco scende dal palco e se ne va)",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che la festa continua.",
            "page": 27
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(La musica riparte)",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "A l’é andà tut bin.",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "A l’é pa capità gnente.",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "RAGAZZA",
            "key": "ragazza",
            "note": "",
            "text": "Era lui. Francesco!",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Chi?",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "RAGAZZA",
            "key": "ragazza",
            "note": "",
            "text": "Francesco",
            "page": 27
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(pausa)",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "RAGAZZA",
            "key": "ragazza",
            "note": "",
            "text": "Non perché fosse santo.",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "RAGAZZA",
            "key": "ragazza",
            "note": "",
            "text": "Ma perché",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "RAGAZZA",
            "key": "ragazza",
            "note": "",
            "text": "non aveva bisogno di esserlo.",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "(turbato)",
            "text": "Hem … Ho appena detto che la festa continua.",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Adesso c’è lo spettacolo teatrale:",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Finalmente “San Francesco nel teatro del paradiso dantesco”",
            "page": 27
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(legge un foglietto e declama)",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Sole che scende a carezzar l’umana sorte",
            "page": 27
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Applausi tutti sistemano sedie e qualcuno si siede per terra, applausi e fischi d’incitamento)",
            "page": 27
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Sale su un palchetto uno strampalato Dante seguito da un improvvisato San Francesco",
            "page": 28
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "Colui che al Sol d’Amor fe’ lieta strada,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "e nuda l’alma rivestì di cielo,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "vinse del mondo l’aspra, vana froda.",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Di Povertà si cinse e d’umìl velo,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "sposando quella che dal Cristo scese,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "e in alto or brilla puro come stelo.",
            "page": 28
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(si anima, voce calda e grandiosa, e legge quasi come una statua che prende vita)",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Io sono Francesco,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "figura ardente e fiaccola levata alta, al vento del Paradiso.",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Io sono l’eco che consola li secoli,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "lo sguardo puro che non trema,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "e la fede che nullo dubbio incrina.",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "A sentirlo parlare sembra che la vita sia una passeggiata in pace…",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E che amare una poesia senza sudore.",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Tu… sei come quei quadri dove resti sempre giovane,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "sempre composto, mai stanco… mai affamato.",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Io sono lo Sposo della Povertà,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "segno incarnato d’umana umiltade,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "perfetta fioritura del Vangelo santo,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "misura vera della santità compiuta.",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Io sono ciò che ’l cor dell’uomo brama ch’io sia:",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "simbolo che non inciampa,",
            "page": 28
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "speme che resta quando terra trema,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "leggenda che conforta li imperfetti.",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Poni tosto la man sopra ’l tuo petto,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "ché io son l’esempio, l’applauso del mondo,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "perfetto, immacolato, levigato.",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Io non tremo, non dubito, non erro,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "ché tolto m’ebbi me medesmo,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "poiché null’altro fui se non un Sì donato a Lui.",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Non amai oro né superba città,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "ma quella gioia nuda e disarmata",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "che pace sparge e l’alma serba intera.",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "E quando il sol s’acqueta nel vespero,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "e ’l creato canta lieto e sobrio,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "allor comprendete: ciascuna creatura è sposa. (pausa)",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Sorella nostra Morte io benedissi,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "non per follia d’animo,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "ma perché nel suo mistero alto e severo",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "essa ne rende uguali, poveri e felici.",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Dunque, mortali, che ancor vi contendete",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "per minime ricchezze e vani onori,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "volgete il core a più soave ricchezza:",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "amate il poco, ché nel poco è il Tutto;",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "chinando il capo, l’anima s’innalza,",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "e ’l cielo cresce dove il cuore langue asciutto.",
            "page": 29
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Così parlava il Santo che s’accese",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "in Umbria, dove nacque come fiore,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ché terra prese, e all’eterno si tese.",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "E in carità trovò del mondo un mesto cuore,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "mentre la notte umana ancor tremava,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "e in lui il fervore fece luce e ardore.",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Qui non basta fede né pietà soltanto:",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "oggi si giudica il canto e la parola!",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Se la poesia consola, ma non muta,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "se illumina il cielo e lascia al buio la terra,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "che bene fa?",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "La poesia non fugge,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma guarda il mondo con pupille ardenti,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ché voce dorme solo se chi ascolta cava.",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Non è del canto il peso dei silenti,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma dei cuori che serrano la via,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "rifiutando del verso i colpi ignei.",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Eppure, spesso il canto diventa velo,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "viene usato dai potenti come scenografia di bontà.",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Si incensano i santi, si alzano inni,",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "poi si lascia il povero dov’era.",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Non è forse un peccato anche questo?",
            "page": 30
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Se mai si tradì il canto, non mia la colpa, ma è d’ignavi",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "che piegan la parola a loro pigria.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Io tremo per l’uomo, e ancor ne scavi",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "il grido mio che il Paradiso sente,",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ché il vero sia ferita sopra i schiavi.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "La poesia non sia sopore sonnolente,",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma lama o fuoco, arma che risveglia,",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "o pietra muta, a seconda di chi sente.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E io ti chiedo questo, Dante:",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "lasciami imperfetto, umano, inquieto.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non farmi mito rassicurante,",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ma memoria viva che punge la coscienza.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non cielo chiuso, ma ferita aperta,",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "altrimenti tutti tranquilli e nessuno cambia niente.",
            "page": 31
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(malizioso)",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Funziona benissimo come alibi.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Dunque, qual è il verdetto?",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Serve la poesia al mondo… o è soltanto un bel suono sopra il dolore?",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "(si toglie il mantello)",
            "text": "Io parlo per chi trema nella fede.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Se Francesco è icona, noi siamo tranquilli,",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "il santo fa per noi ciò che noi non facciamo.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Ma se è uomo vero, allora ci riguarda.",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "E questo spaventa!",
            "page": 31
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Sì, fratello: spaventa.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Meglio un santo custodito in cornice",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "che un uomo libero che ti guarda negli occhi.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "(si rimette il mantello)",
            "text": "Sì, fui cantato dalla luce sorella,",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "e poi, nel canto seguente, noi Francescani",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "rispondemmo con amore al glorïoso Domenico.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Nella perfetta unitade",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "ordini diversi, ma uno Spirito solo!",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "SAN FRANCESCO ATTORE",
            "key": "sanfrancescoattore",
            "note": "",
            "text": "Così piacque a Dio, e così cantò il Poeta benedetto.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Un francescano che loda un domenicano",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e un domenicano che loda un francescano.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Magnifico.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Peccato che poi nella vita vera",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "domenicani e francescani",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "litigavano come in un condominio.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "(molto turbato)",
            "text": "Or ascoltami, o Santo, e meraviglia:",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "io scrissi per percuotere le mura,",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "non per fasciar di sogno ogni famiglia.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Se fui grande, la grandezza mia non dura",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "se non trema di nuovo e non sanguina il vero,",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ché vano è il marmo, se la vita è scura.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Non mausoleo sia il cantar sincero,",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma terremoto che la base frange,",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "scuotendo il cor del mondo prigioniero.",
            "page": 32
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Popolo, i giudici veri siete voi.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "La poesia è colpevole se dormite,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "innocente se vi sveglia.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non assolvete Dante: assumetelo.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non adorate il suo canto: usatelo.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "La parola vive solo quando diventa carne.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E tu Poeta, ascolta.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Tu m’hai vestito di gloria imperitura,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ma la gloria talvolta è una prigione.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io fui uomo: sudai, dubitai, tremai.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Nel tuo poema sono luce pura,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e quella luce acceca la mia umanità.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Tu mi facesti simbolo infinito;",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e i potenti ringraziano.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Più facile è venerare un santo intoccabile che sopportare un uomo che contesta.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Non fu il mio verso a fabbricar catene,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma mani d’uom che leggono alla cieca;",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "io vidi in te rivoluzion serene,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "povertà regale che superbo piega,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "grido che sfonda il trono dell’orgoglio;",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "se oggi tu sei icona che non prega,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "non accusare il canto, né il travaglio",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "della parola mia che arde e suona,",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma chi dormendo t’ha mutato in soglio.",
            "page": 33
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Eppure, Dante, la tua altezza pesa.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Sono diventato paradiso e marmo,",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "non fratello, non compagno di strada.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Si baciano reliquie, si adornano altari,",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ma pochi dividono pane, terra e vita.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Si ama Francesco come dolce quadro,",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "non come ferita che domanda scelta.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Poeta, tuo canto è grande, e non lo nego,",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ma non farmi solo eco di parole.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non sono cielo lontano, ma sono terra, guerra, ferita e scelta quotidiana.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Però la poesia, di tanto va sgonfiata.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "altrimenti vola e non tocca terra.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "Forse, o Santo, il poema ti imprigiona",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "là dove in ver voleva darti il volo:",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "DANTE ATTORE",
            "key": "danteattore",
            "note": "",
            "text": "ma ancor risuoni viva la tua suona.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Volare? Il Vangelo, mi spiace, funziona solo a contatto col suolo.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Sciogli allora il canto nel silenzio dell’uomo vivo,",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "lascia che il mio esempio non sia cornice,",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ma fenditura dentro la storia.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Se poesia vive, che bruci.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Se sopravvive, che disturbi.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Se consola, che lo faccia",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "non senza prima far pensare.",
            "page": 34
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "(si toglie il mantello)",
            "text": "Forse oggi non finisce una devozione…",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "forse oggi comincia una responsabilità.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "(ritorna in scena)",
            "text": "Così desidero. Non Santo perfetto da idolatrare,",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ma essere umano che ancora vi sfida ad amare senza misura.",
            "page": 35
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(scende dal palco e scompare)",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "(tutti lo cercano)",
            "page": 35
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "L’icona si è spezzata, ma non è morto il santo: ora respira.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "RAGAZZA",
            "key": "ragazza",
            "note": "",
            "text": "Mi sa proprio che, se Francesco tornasse oggi, lo cacceremmo per eccesso di francescanesimo.",
            "page": 35
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(escono tutti)",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "È finita.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Come finiscono tutte le feste.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Restano i bicchieri.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Le sedie fuori posto.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "I tecnici che smontano.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Qualcuno ha detto:",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "“È andata bene.”",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che è una frase bellissima, ma terribile.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Perché andata bene può nascondere quello che non si ha voglia di nominare!",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Abbiamo parlato di Francesco.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Lo abbiamo cercato.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Lo abbiamo perso.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Lo abbiamo inseguito dentro le bancarelle, nelle suore, nei cori, nei giornalisti, nelle parole troppo grandi.",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "E alla fine sapete cosa abbiamo trovato?",
            "page": 35
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Una cosa scomodissima.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che Francesco funzionava meglio da uomo che da statua.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Molto peggio per l’organizzazione.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Molto meglio per l’umanità.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E allora qualcuno potrebbe chiedere:",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "“Va bene tutto.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Ma Dante che c’entra?",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Che ci fa il Paradiso in questa storia piena di rumore, fiere, panini, selfie, contraddizioni e coscienze che zoppicano?”",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Eh…",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Domanda giusta.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché il Paradiso di Dante noi ce lo immaginiamo come una specie di condominio di santi soddisfatti.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Tutti luminosi.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Tutti perfetti.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Una riunione di gente che non sbaglia più.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Ma il Paradiso dantesco è molto più pericoloso.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché non parla dei morti.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Parla dei vivi.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Parla di noi.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Parla di ciò che potremmo diventare.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Dante prende Francesco…",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e lo mette nel cielo.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Noi prendiamo Francesco…",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e lo mettiamo sul manifesto.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Dante lo fa esplodere nella luce.",
            "page": 36
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Noi spesso lo riduciamo a grafica coordinata.",
            "page": 36
      },
      {
            "type": "line",
