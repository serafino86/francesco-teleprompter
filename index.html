<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prima che finisca l'attesa - Teleprompter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --panel: rgba(0, 0, 0, 0.24);
      --line: rgba(255, 255, 255, 0.28);
      --muted: rgba(255, 255, 255, 0.76);
      --text: #f8fafc;
      --accent: #f8fafc;
      --button-bg: rgba(0, 0, 0, 0.25);
      --next-text: rgba(255, 255, 255, 0.88);
      --next-bg: rgba(0, 0, 0, 0.25);
      --next-contrast: #f8fafc;
      --next-muted: rgba(255, 255, 255, 0.76);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 320px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 22px 30px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }

    .speaker {
      min-width: 0;
    }

    .speaker-name {
      color: var(--text);
      font-size: clamp(28px, 4.4vh, 60px);
      font-weight: 850;
      letter-spacing: 0;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .speaker-note {
      display: none;
      margin-top: 8px;
      color: var(--muted);
      font-size: 22px;
      font-style: italic;
    }

    .speaker-note.visible {
      display: block;
    }

    .counter {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      white-space: nowrap;
    }

    .stage {
      --bg: #475569;
      --accent: #475569;
    }

    .section {
      --bg: #111827;
      --accent: #111827;
    }

    .main {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 22px;
      min-height: 0;
      padding: 30px;
    }

    .current {
      display: grid;
      place-items: safe center;
      min-height: 0;
      overflow: auto;
      scrollbar-gutter: stable;
      border-bottom: 1px solid var(--line);
      padding: 18px 0 34px;
    }

    .line-text {
      max-width: 1180px;
      width: 100%;
      color: var(--text);
      font-size: clamp(48px, var(--cue-size, 8.6vh), 116px);
      font-weight: 760;
      line-height: 1.12;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .stage .line-text {
      color: var(--text);
      font-size: clamp(36px, calc(var(--cue-size, 8.6vh) * 0.68), 78px);
      font-style: italic;
      font-weight: 580;
    }

    .section .line-text {
      color: var(--text);
      font-size: clamp(48px, calc(var(--cue-size, 8.6vh) * 0.92), 104px);
      font-weight: 860;
      text-transform: uppercase;
    }

    .next {
      display: grid;
      grid-template-columns: minmax(130px, 190px) 1fr;
      gap: 20px;
      align-items: start;
      width: 100%;
      height: clamp(104px, 22vh, 190px);
      min-height: 0;
      overflow: hidden;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--next-bg);
      backdrop-filter: blur(10px);
    }

    .next-content {
      min-width: 0;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .next-label {
      color: var(--next-muted);
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .next-speaker {
      color: var(--next-contrast);
      font-size: clamp(20px, 2.5vh, 32px);
      font-weight: 800;
      line-height: 1.1;
    }

    .next-text {
      margin-top: 8px;
      color: var(--next-contrast);
      font-size: clamp(22px, 3.1vh, 40px);
      font-weight: 640;
      line-height: 1.18;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px 30px 20px;
      background: var(--panel);
      backdrop-filter: blur(10px);
    }

    .button-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .soundboard { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-height: 78px; overflow-y: auto; padding-top: 4px; }
    .soundboard button { flex: 0 0 auto; width: auto; min-width: 42px; height: 32px; padding: 0 9px; font-size: 12px; white-space: nowrap; }
    .soundboard input { width: 84px; accent-color: var(--accent); }

    button {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--text);
      font: inherit;
      font-size: 24px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .progress {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.24);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 520px;
    }

    .chip {
      display: grid;
      grid-template-columns: 12px auto;
      gap: 6px;
      align-items: center;
      color: #cbd5e1;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.72;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--chip);
    }

    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; gap: 8px; padding: 8px 12px 12px; }
      .button-row { justify-content: center; }
      .progress { order: 2; }
      .soundboard { order: 3; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; max-height: 44px; }
      .palette { order: 4; overflow-x: auto; }
      .topbar,
      .main,
      .controls {
        padding-left: 16px;
        padding-right: 16px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .next {
        grid-template-columns: 1fr;
      }

      .palette {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="speaker">
      <div id="speakerName" class="speaker-name"></div>
      <div id="speakerNote" class="speaker-note"></div>
    </div>
    <div id="counter" class="counter"></div>
  </header>

  <main id="screen" class="main">
    <section class="current" aria-live="polite">
      <div id="lineText" class="line-text"></div>
    </section>
    <aside id="nextPanel" class="next">
      <div class="next-label">Prossima</div>
      <div class="next-content">
        <div id="nextSpeaker" class="next-speaker"></div>
        <div id="nextText" class="next-text"></div>
      </div>
    </aside>
  </main>

  <footer class="controls">
    <div class="button-row">
      <button id="prevBtn" type="button" title="Indietro">‹</button>
      <button id="nextBtn" type="button" title="Avanti">›</button>
      <button id="smallerBtn" type="button" title="Testo più piccolo">−</button>
      <button id="largerBtn" type="button" title="Testo più grande">+</button>
      <button id="fullBtn" type="button" title="Schermo intero">⛶</button>
    </div>
    <div class="progress" aria-hidden="true">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="soundboard" class="soundboard" aria-label="Tastiera audio"></div>
    <button id="offlineBtn" class="offline-btn" type="button" title="Scarica questa pagina per usarla offline">Scarica offline</button>
    <div id="palette" class="palette"></div>
  </footer>

  <script>
    // Sostituisci questi dati di esempio con il nuovo copione completo.
    const speakers = [
      {
        "key": "narratrice",
        "label": "NARRATRICE",
        "color": "#f8fafc"
      },
      {
        "key": "narratore",
        "label": "NARRATORE",
        "color": "#4ea1ff"
      },
      {
        "key": "paesana1",
        "label": "PAESANA 1",
        "color": "#c084fc"
      },
      {
        "key": "paesana2",
        "label": "PAESANA 2",
        "color": "#facc15"
      },
      {
        "key": "coro",
        "label": "CORO",
        "color": "#4ade80"
      },
      {
        "key": "fratefrancesco",
        "label": "FRATE FRANCESCO",
        "color": "#fb923c"
      },
      {
        "key": "fraticello",
        "label": "FRATICELLO",
        "color": "#f87171"
      },
      {
        "key": "giornalista",
        "label": "GIORNALISTA",
        "color": "#22d3ee"
      },
      {
        "key": "suora1",
        "label": "SUORA 1",
        "color": "#a78bfa"
      },
      {
        "key": "suora2",
        "label": "SUORA 2",
        "color": "#34d399"
      },
      {
        "key": "suora3",
        "label": "SUORA 3",
        "color": "#f472b6"
      },
      {
        "key": "ragazza",
        "label": "RAGAZZA",
        "color": "#60a5fa"
      },
      {
        "key": "danteattore",
        "label": "DANTE ATTORE",
        "color": "#fbbf24"
      },
      {
        "key": "sanfrancescoattore",
        "label": "SAN FRANCESCO ATTORE",
        "color": "#2dd4bf"
      },
      {
        "key": "corofinale",
        "label": "CORO FINALE",
        "color": "#e879f9"
      },
      {
        "key": "stage",
        "label": "DIDASCALIA",
        "color": "#94a3b8"
      },
      {
        "key": "section",
        "label": "SEZIONE",
        "color": "#e2e8f0"
      }
    ];
    const cues = [
      {
            "type": "section",
            "speaker": "TITOLO",
            "key": "section",
            "note": "",
            "text": "FRANCESCO NON E’ QUI",
            "page": 2
      },
      {
            "type": "section",
            "speaker": "TITOLO",
            "key": "section",
            "note": "",
            "text": "Atto unico scritto da Alessandro La Noce",
            "page": 2
      },
      {
            "type": "section",
            "speaker": "TITOLO",
            "key": "section",
            "note": "",
            "text": "PROLOGO",
            "page": 2
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Buio. Si sente il rumore di una fiera lontana: vocio di folla, una musica moderna che pulsa piano. Poi, quasi impercettibile, il suono di un flauto. Una donna entra.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Sentite? No, non la musica. Quella la sentono tutti.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Io dico quell’altra. Quella che sta sotto.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Il rumore delle scarpe sulla polvere.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Il fiato corto di uno che cammina troppo.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "La stoffa ruvida. La fame.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché ogni tanto ci dimentichiamo una cosa curiosa:",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "che i santi, prima di diventare statue… sono stati persone.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Con piedi. Vesciche. Dubbi. Perfino giornate storte.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E Francesco… ah, Francesco…",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "noi lo abbiamo preso e trattato come si fa con certi parenti illustri:",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "prima gli facciamo il monumento, poi gli impediamo di parlare.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Gli abbiamo dato tutto.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Quadri, luci, convegni, celebrazioni…. perfino gadget.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Eppure, io ho il sospetto che l’uomo vero fosse molto meno comodo.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Uno che disturbava. Uno che, entrando in una stanza, non portava tranquillità…",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "portava domande. Quelle brutte.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Quelle che ti spostano i mobili dentro.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché il problema dei rivoluzionari è sempre lo stesso:",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "da vivi fanno paura, da morti diventano arredamento.",
            "page": 2
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "E allora eccoci qui.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Tra il suono delle piazze.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Tra parole troppo grandi.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Tra chi cerca il santo… e chi, ostinatamente, continua a cercare l’uomo.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "L’uomo che rideva. Che tremava.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che forse qualche volta avrà pensato:",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "“Ma chi me l’ha fatto fare?”",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "L’uomo che non voleva essere marmo.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che forse avrebbe preferito una panca. Una strada. Un pezzo di pane condiviso.",
            "page": 3
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(La musica della fiera cresce appena. Lei ascolta.)",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Sentite adesso? Ecco.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Sta arrivando il rumore del mondo.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Quello che vende.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che celebra.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che fotografa.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che applaude.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Che mette luci ovunque…",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "per non vedere il buio.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "E in mezzo a tutto questo… forse…",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "forse passa ancora qualcuno.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Scambiato per comparsa. Per figurante. Per pazzo. Per disturbatore professionista.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "E magari è proprio lui.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Non il santo.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Non l’icona.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Non il patrono.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "L’uomo.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Francesco.",
            "page": 3
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Quello che non è qui…",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e proprio per questo continua a cercarci.",
            "page": 4
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Pausa. Sorriso leggero.)",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "State attenti però.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Perché se davvero entrasse adesso…",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "con questa faccia un po’ stanca,",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "i vestiti consumati",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "e quella strana abitudine di dire la verità…",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "c’è il rischio che non lo facciamo salire sul palco.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Gli daremmo il posto in ultima fila.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Per poi magari organizzare l’ennesimo convegno o scrivere l’ennesimo libro… su di lui.",
            "page": 4
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Si volta verso il buio della scena.)",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Venite.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "La fiera sta per aprire.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Le luci sono accese.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Le coscienze… vedremo.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E da qualche parte,",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "tra il rumore e il silenzio,",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "un uomo sta ancora aspettando",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "di essere raccontato male.",
            "page": 4
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Cioè: umanamente.",
            "page": 4
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "Luci. Striscioni: “800 ANNI DI SAN FRANCESCO”. Ritratto di San Francesco, +",
            "page": 5
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "Musica da discoteca a volume alto.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "(guardando attorno, sospira)",
            "text": "Guarda… guarda che meraviglia.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Dove c’era il silenzio, adesso c’è il volume massimo.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Dove c’era devozione, ora stampano scontrini.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(amaro)",
            "text": "Eh… San Francesco versione fiera campionaria.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Vendono di tutto… tranne quello che servirebbe davvero.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "(indicando una bancarella)",
            "text": "“Panino benedetto 8 euro”.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Beati loro… almeno credono al miracolo del guadagno.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Guarda i gadget:",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "San Francesco fluorescente,",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "San Francesco con lucetta led,",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "San Francesco a palla di neve.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Manca solo San Francesco col telecomando… e facciamo bingo.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "(più accorato)",
            "text": "E pensare che lui voleva spogliarsi di tutto…",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "e noi invece l’abbiamo rivestito… di sponsor.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(tagliente)",
            "text": "Già. L’umiltà non vende,",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "il silenzio non riempie le piazze, la povertà non fa incassi.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Così lo trasformi in merchandising … e smette di disturbare.",
            "page": 5
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "(indicando la folla)",
            "text": "Eccoli i devoti moderni, non pregano, postano.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Non si inginocchiano, si mettono in posa.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "San Francesco… sorridi, che siamo in diretta!",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "E nel frattempo, tra una storia e un tag, sparisce il senso.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Sparisce l’uomo. Resta solo l’immagine.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(amara ironia)",
            "text": "Però funziona:",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "trasformi il santo in spettacolo… e la coscienza dorme meglio.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Ti senti buono… senza cambiare niente.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Ti ricordi com’era?",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Festa piccola, povera, storta… ma vera.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Tre luci mosce… e il cuore sveglio.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Ora invece: più luci abbiamo, meno vediamo.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Più rumore facciamo, meno ascoltiamo.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Più celebriamo il Santo… meno gli assomigliamo.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "San Francesco non è nato per riempire piazze,",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "ma per svuotare ego.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Noi abbiamo fatto l’opposto:",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "piazze piene, anime sfitte.",
            "page": 6
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(con sarcasmo dolce)",
            "text": "E guai a dirlo!",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Se critichi sei “contro la tradizione”.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Quale tradizione?",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Se vedesse questo circo… Francesco chiederebbe il trasferimento.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "(più intimo)",
            "text": "E noi, che stiamo qui a borbottare… che siamo?",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Migliori? No.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Solo più inquieti.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Già… e forse è già qualcosa.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Almeno non siamo anestetizzati.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Io non odio la festa.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Odio quando la festa diventa copertura.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Quando usano il Santo come carta igienica morale.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(più civile, fermo)",
            "text": "Comodissimo il santo-candeggina:",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "puoi sporcarti quanto vuoi… poi vieni qui",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "e ti senti santo per default.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Io sogno una festa più povera e più ricca:",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "meno luci, più verità.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Meno marketing, più carne viva.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Una festa che qualche domanda te la faccia venire…",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "non che te la tolga.",
            "page": 7
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(sorriso triste)",
            "text": "Sarebbe pericolosa.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Qui preferiamo appiccicare francobolli di bontà sulla coscienza…",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "non aprirla.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Eppure, lui è ancora lì. Immobilizzato da noi… ma non sconfitto.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(quasi dolce)",
            "text": "Sì… mentre noi lo vendiamo,",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "lui continua a guardarci.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Forse ride. Forse piange. O forse fa tutte e due le cose insieme.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "(alzando la voce)",
            "text": "Ma ditemi voi… questa sarebbe musica per San Francesco?!",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Discoteca, luci, bum bum… che facciamo, paradiso o balera?",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "(sorridendo storto)",
            "text": "Tranquilla: è il nuovo canto francescano…",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Ma che c’entra con Francesco? A me sembra solo una sagra del rumore…",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Eh… oggi la fede si misura a decibel.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Se non vibra il pavimento, non è spirituale.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 1",
            "key": "paesana1",
            "note": "",
            "text": "Guarda… se parte il remix del Cantico delle Creature… io vado via.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "No, resta… magari succede il miracolo:",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "e abbassano il volume.",
            "page": 8
      },
      {
            "type": "line",
            "speaker": "PAESANA 2",
            "key": "paesana2",
            "note": "",
            "text": "Il Coro si sistema. Francesco è già lì, confuso tra la gente",
            "page": 9
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(rumori e voci di una fiera)",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Prova microfono.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Uno. Due.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ottocento anni di luce.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Tutti parlano di Francesco.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Tutti lo citano.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Tutti lo usano.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "“ecologista, pacifista, brand turistico…”",
            "page": 9
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(musica e bancarelle)",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "San Francesco!",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Patrono della pace!",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Della natura!",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Della gioia!",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Mi raccomando: tono positivo.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Deve piacere a tutti.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Tutti parlano di Francesco.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Tutti lo citano.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Tutti lo usano.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Attenzione. Ricordiamoci che questa è una festa.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ottocento anni non si fanno tutti i giorni.",
            "page": 9
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "San Francesco!",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Pace!",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Natura!",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Fratellanza!",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Scusate.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Di quale Francesco parlate?",
            "page": 10
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Silenzio. Una risata.)",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Bravo.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Animazione storica?",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Di San Francesco, il poverello di Assisi.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Questa festa è un segno forte.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Francesco, il primo italiano unisce credenti e non credenti.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Veramente lui divideva.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Intende dire… in senso spirituale?",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "No. In senso pratico.",
            "page": 10
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Noi invece aiutiamo tutti.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Tutti quelli che non fanno troppe domande!",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ah.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E se lo incontraste come lo riconoscereste?",
            "page": 11
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Risate.)",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Bravo.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Interattivo.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ma questo chi l’ha invitato?",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Francesco è il santo che unisce.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Lo dimostra questa piazza.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Lui non univa le piazze.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Le svuotava.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Intende dire… spiritualmente?",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "No.",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Intendo che quando uno smette di possedere …",
            "page": 11
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "qualcuno resta senza posto.",
            "page": 11
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(ridendo)",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "È bravo.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "È preparato!",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "È un personaggio!",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Francesco ha fondato un grande Ordine.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Solo due paginette e voi le avete corrette.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Solo per renderle attuali.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Per renderle possibili.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "La finisca. Senza regole non si va avanti.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Nemmeno col Vangelo.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Eppure, ci avete provato.",
            "page": 12
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Entra un FRATICELLO, elegante, cartellina in mano.)",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Noi, come Frati Minori,",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "custodiamo il carisma.",
            "page": 12
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Custodire è già troppo.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Abbiamo conventi, regole, orari.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Anch’io.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Quando ho fame.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Ma senza struttura il carisma si perde.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "No. Si perde quando smette di fare paura",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Basta! Francesco ha scritto una Regola.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Sì. Ma con il Vangelo.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Ma così era impraticabile.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Lo so.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Forse l’abbiamo solo resa ragionevole.",
            "page": 13
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Avete tolto Cristo perché era scomodo.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Avete messo la prudenza perché era utile.",
            "page": 14
      },
      {
            "type": "stage",
            "speaker": "DIDASCALIA",
            "key": "stage",
            "note": "",
            "text": "(Silenzio)",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Attenzione, però.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Qui siamo a una festa.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "E la povertà va gestita.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io l’ho sempre abitata.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ma oggi ci sono fondi, bandi, progetti.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma io ho fame.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "La povertà è complessa.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "No. È semplice.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "È chi la guarda che la complica,",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "chi la guarda che diventa confuso.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Oggi c’è una comunità da tutelare.",
            "page": 14
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "No. Una comunità da non disturbare.",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Se tu fossi davvero Francesco…",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "…sarei un problema.",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Ecco noi non possediamo nulla.",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E il convento?",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "È intestato.",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "A chi?",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Alla Santa Sede.",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Dormite dentro?",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Sì.",
            "page": 15
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Mangiate?",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Sì.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Allora anche il diavolo può dire che l’inferno non è suo:",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "ci abita soltanto.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Servono soluzioni.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non guardate me, io le soluzioni le complico.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ma la città ha bisogno di ordine.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "L’ordine senza giustizia",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "è silenzio ben pettinato.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Lei è fuori dal tempo.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Forse fin troppo dentro al mio tempo, è per questo che faccio ancora paura.",
            "page": 16
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Sì, va bene. Abbiamo capito.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Il dolore. La verità. La ferita",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Ma adesso basta.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Noi dobbiamo vivere. Vogliamo divertirci!",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Capisco, la convivenza tra istituzioni è sempre delicata.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Lo so. È successo anche a Pinerolo nel XVII secolo.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "NARRATRICE",
            "key": "narratrice",
            "note": "",
            "text": "Pinerolo?",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "(sorpreso)",
            "text": "Come fa a sapere…?",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "I frati si lamentavano.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Troppo rumore.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Il Consiglio dei Venticinque e quello dei Cento",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "disturbavano la preghiera.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E la città diceva:",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "“Qui teniamo le carte.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Qui conserviamo la memoria.”",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATICELLO",
            "key": "fraticello",
            "note": "",
            "text": "Era una causa seria.",
            "page": 17
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Certo. La preghiera disturbata dal governo.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Il governo disturbato dalla preghiera.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "E chi aveva ragione?",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Nessuno.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Perché, quando la fede chiede silenzio",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e la politica chiede spazio,",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "qualcuno ha già smesso di ascoltare.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Ma qui c’è una comunità.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Si. Da non disturbare.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "Se lei fosse davvero Francesco…",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Sarei un problema.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "NARRATORE",
            "key": "narratore",
            "note": "",
            "text": "I simboli servono.",
            "page": 18
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Un Francesco che soffre in silenzio va bene.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Uno che parla ancora è ingombrante.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Non ti abbiamo ucciso.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Ti abbiamo reso compatibile.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Non sono d’accordo",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "nemmeno con chi mi ha amato.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Fra Tommaso mi ha guardato da vicino.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Troppo vicino.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Mi ha visto abbassare le maniche, stringere i pugni, coprire la carne ferita.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E diceva: Francesco non vuole essere visto.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Diceva: Francesco nasconde.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Fra Bonaventura mi ha guardato da lontano.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Troppo lontano.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Mi ha innalzato su un monte, mi ha messo in posa, mi ha aperto le mani.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "E ha detto: Francesco deve essere visto.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Francesco assomiglia a Cristo.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma io non volevo né sparire",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "né diventare una figura.",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Ma noi vogliamo che Francesco sia un simbolo!",
            "page": 19
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Frate Tommaso ha capito il mio pudore. Non la mia paura.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io non nascondevo le stimmate per umiltà.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Le nascondevo perché bruciavano.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Perché facevano male.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Perché non erano un segno:",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "erano una ferita.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Frate Bonaventura ha capito il simbolo. Non il corpo.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ha preso il mio dolore",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e l’ha reso necessario.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ha detto: Così deve essere, perché la Chiesa abbia il suo Cristo minore.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Ma io non volevo essere minore di nessuno. Volevo essere uomo.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "CORO",
            "key": "coro",
            "note": "",
            "text": "Noi vogliamo il Santo, non l’uomo!",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Il vero Francesco è nel punto esatto che li mette in crisi entrambi:",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "tra la carne che sanguina",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "e l’istituzione che ha bisogno di luce.",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "Io non volevo mostrare le stimmate",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
            "key": "fratefrancesco",
            "note": "",
            "text": "perché attirano sguardi,",
            "page": 20
      },
      {
            "type": "line",
            "speaker": "FRATE FRANCESCO",
